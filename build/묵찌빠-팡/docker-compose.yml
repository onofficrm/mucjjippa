# 묵찌빠 팡 — Docker Compose
# 사용:
#   cp deploy/env/development.env.example .env.docker
#   docker compose --env-file .env.docker up --build
#
# 스테이징/프로덕션:
#   docker compose --env-file deploy/env/staging.env.example -f docker-compose.yml -f docker-compose.prod.yml up -d --build

name: mucjjippa-pang

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mucjjippa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mucjjippa}
      POSTGRES_DB: ${POSTGRES_DB:-mucjjippa}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/backup:/backup
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mucjjippa} -d ${POSTGRES_DB:-mucjjippa}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      APP_ENV: ${APP_ENV:-development}
      HOST: 0.0.0.0
      PORT: 4000
      API_PREFIX: /api
      API_VERSION: v1
      DATABASE_URL: postgresql://${POSTGRES_USER:-mucjjippa}:${POSTGRES_PASSWORD:-mucjjippa}@postgres:5432/${POSTGRES_DB:-mucjjippa}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://127.0.0.1:3000,http://localhost}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_DIR: ${LOG_DIR:-/app/logs}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SEED_MODE: ${SEED_MODE:-catalog}
      RUN_SEED: ${RUN_SEED:-false}
      SKIP_MIGRATE: ${SKIP_MIGRATE:-false}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin1234!}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-User1234!}
      EXPOSE_API_DOCS: ${EXPOSE_API_DOCS:-true}
    volumes:
      - server_logs:/app/logs
    ports:
      - "${SERVER_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_WS_URL: ${VITE_WS_URL:-}
        VITE_APP_ENV: ${APP_ENV:-development}
        VITE_USE_MOCK: ${VITE_USE_MOCK:-false}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  postgres_data:
  redis_data:
  server_logs:
